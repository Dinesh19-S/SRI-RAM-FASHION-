<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" style="font-family: Arial, sans-serif;">
  <!-- Definitions -->
  <defs>
    <filter id="shadow" x="0" y="0" width="105%" height="105%">
      <feOffset result="offOut" in="SourceAlpha" dx="3" dy="3" />
      <feGaussianBlur result="blurOut" in="offOut" stdDeviation="3" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="#fff" />
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- User Table (Blue) -->
  <g transform="translate(50, 50)" filter="url(#shadow)">
    <rect width="220" height="150" fill="#fff" stroke="#2c3e50" stroke-width="1" />
    <rect width="220" height="40" fill="#2c3e50" />
    <text x="110" y="28" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">User</text>
    
    <text x="10" y="65" font-size="12" fill="#333">. _id (PK)</text>
    <text x="10" y="85" font-size="12" fill="#333">. name</text>
    <text x="10" y="105" font-size="12" fill="#333">. email</text>
    <text x="10" y="125" font-size="12" fill="#333">. role</text>
  </g>

  <!-- Bill Table (Green) -->
  <g transform="translate(400, 50)" filter="url(#shadow)">
    <rect width="220" height="230" fill="#fff" stroke="#27ae60" stroke-width="1" />
    <rect width="220" height="40" fill="#27ae60" />
    <text x="110" y="28" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">Bill (Order)</text>
    
    <text x="10" y="65" font-size="12" fill="#333">. _id (PK)</text>
    <text x="10" y="85" font-size="12" fill="#333">. billNumber</text>
    <text x="10" y="105" font-size="12" fill="#333">. customer (Ref)</text>
    <text x="10" y="125" font-size="12" fill="#333">. items (Array)</text>
    <text x="10" y="145" font-size="12" fill="#333">. totalAmount</text>
    <text x="10" y="165" font-size="12" fill="#333">. paymentStatus</text>
    <text x="10" y="185" font-size="12" fill="#333">. createdBy (User ID)</text>
    <text x="10" y="205" font-size="12" fill="#333">. date</text>
  </g>

  <!-- Product Table (Orange) -->
  <g transform="translate(730, 50)" filter="url(#shadow)">
    <rect width="220" height="210" fill="#fff" stroke="#d35400" stroke-width="1" />
    <rect width="220" height="40" fill="#d35400" />
    <text x="110" y="28" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">Product</text>
    
    <text x="10" y="65" font-size="12" fill="#333">. _id (PK)</text>
    <text x="10" y="85" font-size="12" fill="#333">. name</text>
    <text x="10" y="105" font-size="12" fill="#333">. sku</text>
    <text x="10" y="125" font-size="12" fill="#333">. category (Category ID)</text>
    <text x="10" y="145" font-size="12" fill="#333">. sellingPrice</text>
    <text x="10" y="165" font-size="12" fill="#333">. stock</text>
    <text x="10" y="185" font-size="12" fill="#333">. lowStockThreshold</text>
  </g>

  <!-- Customer Table (Purple) -->
  <g transform="translate(50, 400)" filter="url(#shadow)">
    <rect width="220" height="190" fill="#fff" stroke="#8e44ad" stroke-width="1" />
    <rect width="220" height="40" fill="#8e44ad" />
    <text x="110" y="28" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">Customer</text>
    
    <text x="10" y="65" font-size="12" fill="#333">. _id (PK)</text>
    <text x="10" y="85" font-size="12" fill="#333">. companyName</text>
    <text x="10" y="105" font-size="12" fill="#333">. mobile</text>
    <text x="10" y="125" font-size="12" fill="#333">. email</text>
    <text x="10" y="145" font-size="12" fill="#333">. gstin</text>
    <text x="10" y="165" font-size="12" fill="#333">. address</text>
  </g>

  <!-- Payment Table (Yellow) - matches example -->
  <g transform="translate(400, 400)" filter="url(#shadow)">
    <rect width="220" height="190" fill="#fff" stroke="#f1c40f" stroke-width="1" />
    <rect width="220" height="40" fill="#f1c40f" />
    <text x="110" y="28" text-anchor="middle" fill="#000" font-weight="bold" font-size="16">Payment</text>
    
    <text x="10" y="65" font-size="12" fill="#333">. _id (PK)</text>
    <text x="10" y="85" font-size="12" fill="#333">. type (sales/purchase)</text>
    <text x="10" y="105" font-size="12" fill="#333">. customer/supplier (Ref)</text>
    <text x="10" y="125" font-size="12" fill="#333">. amount</text>
    <text x="10" y="145" font-size="12" fill="#333">. paymentType</text>
    <text x="10" y="165" font-size="12" fill="#333">. date</text>
  </g>

  <!-- StockMovement Table (Red) -->
  <g transform="translate(730, 400)" filter="url(#shadow)">
    <rect width="220" height="170" fill="#fff" stroke="#c0392b" stroke-width="1" />
    <rect width="220" height="40" fill="#c0392b" />
    <text x="110" y="28" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">StockMovement</text>
    
    <text x="10" y="65" font-size="12" fill="#333">. _id (PK)</text>
    <text x="10" y="85" font-size="12" fill="#333">. product (Product ID)</text>
    <text x="10" y="105" font-size="12" fill="#333">. type (in/out)</text>
    <text x="10" y="125" font-size="12" fill="#333">. quantity</text>
    <text x="10" y="145" font-size="12" fill="#333">. previousStock</text>
  </g>

  <!-- Connections -->
  <!-- User to Bill -->
  <path d="M 270 125 L 400 125" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Bill to Product -->
  <path d="M 620 125 L 730 125" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Bill to Payment -->
  <path d="M 510 280 L 510 400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" />
  
  <!-- Customer to Bill -->
  <path d="M 270 420 L 335 420 L 335 200 L 400 200" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" stroke-dasharray="5,5" />
  
  <!-- Customer to Payment -->
  <path d="M 270 450 L 400 450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" />

  <!-- Product to StockMovement -->
  <path d="M 840 260 L 840 400" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" />

</svg>
