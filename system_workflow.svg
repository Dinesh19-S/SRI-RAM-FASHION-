<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <!-- Definitions -->
  <defs>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
     <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#fdfdfd" />
  <text x="600" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#2c3e50">SYSTEM WORKFLOW DIAGRAM - SRI RAM FASHION</text>

  <!-- Role Layers -->
  <!-- Left Side: Staff/Admin Interaction -->
  <g transform="translate(100, 100)">
    <!-- User/Admin Input -->
    <rect width="180" height="45" rx="5" fill="url(#blueGrad)" filter="url(#boxShadow)" />
    <text x="90" y="28" text-anchor="middle" fill="#fff" font-weight="bold">Staff / Admin</text>
    
    <line x1="90" y1="45" x2="90" y2="80" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
    
    <!-- Authentication -->
    <g transform="translate(0, 80)">
      <rect width="180" height="45" rx="5" fill="url(#darkGrad)" filter="url(#boxShadow)" />
      <text x="90" y="28" text-anchor="middle" fill="#fff" font-weight="bold">Authentication</text>
      
      <!-- Paths from Auth -->
      <path d="M 90 45 L 90 90 L 500 90 L 500 130" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
      <text x="250" y="85" font-size="12" fill="#666">On Success</text>
    </g>
  </g>

  <!-- Core Modules Layer -->
  <g transform="translate(50, 320)">
    <!-- Sales Module -->
    <g transform="translate(0, 0)">
      <rect width="200" height="50" rx="5" fill="url(#greenGrad)" filter="url(#boxShadow)" />
      <text x="100" y="30" text-anchor="middle" fill="#fff" font-weight="bold">Sales Management</text>
      
      <line x1="100" y1="50" x2="100" y2="90" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
      
      <g transform="translate(0, 90)">
        <rect width="200" height="80" rx="5" fill="#fff" stroke="#27ae60" stroke-width="1" filter="url(#boxShadow)" />
        <text x="10" y="30" font-size="13" font-weight="bold">. Create Bill</text>
        <text x="10" y="50" font-size="13" font-weight="bold">. Print Invoice</text>
        <text x="10" y="70" font-size="13" font-weight="bold">. Track Payment</text>
        
        <line x1="200" y1="40" x2="250" y2="40" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
      </g>
    </g>

    <!-- Purchase Module -->
    <g transform="translate(300, 0)">
      <rect width="200" height="50" rx="5" fill="url(#orangeGrad)" filter="url(#boxShadow)" />
      <text x="100" y="30" text-anchor="middle" fill="#fff" font-weight="bold">Purchase Management</text>
      
      <line x1="100" y1="50" x2="100" y2="90" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
      
      <g transform="translate(0, 90)">
        <rect width="200" height="80" rx="5" fill="#fff" stroke="#d35400" stroke-width="1" filter="url(#boxShadow)" />
        <text x="10" y="30" font-size="13" font-weight="bold">. Supplier Entry</text>
        <text x="10" y="50" font-size="13" font-weight="bold">. Purchase Invoice</text>
        <text x="10" y="70" font-size="13" font-weight="bold">. Supplier Payment</text>
        
        <line x1="200" y1="40" x2="250" y2="40" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
      </g>
    </g>

    <!-- Inventory Module -->
    <g transform="translate(600, 0)">
      <rect width="200" height="50" rx="5" fill="url(#redGrad)" filter="url(#boxShadow)" />
      <text x="100" y="30" text-anchor="middle" fill="#fff" font-weight="bold">Inventory Control</text>
      
      <line x1="100" y1="50" x2="100" y2="90" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
      
      <g transform="translate(0, 90)">
        <rect width="200" height="80" rx="5" fill="#fff" stroke="#c0392b" stroke-width="1" filter="url(#boxShadow)" />
        <text x="10" y="30" font-size="13" font-weight="bold">. Stock Tracking</text>
        <text x="10" y="50" font-size="13" font-weight="bold">. Product Catalog</text>
        <text x="10" y="70" font-size="13" font-weight="bold">. Low Stock Alerts</text>
        
        <line x1="0" y1="40" x2="-50" y2="40" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
        <line x1="0" y1="40" x2="-350" y2="40" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
      </g>
    </g>

    <!-- Reports Module -->
    <g transform="translate(900, 0)">
      <rect width="200" height="50" rx="5" fill="url(#purpleGrad)" filter="url(#boxShadow)" />
      <text x="100" y="30" text-anchor="middle" fill="#fff" font-weight="bold">Reports &amp; Analytics</text>
      
      <line x1="100" y1="50" x2="100" y2="90" stroke="#444" stroke-width="2" marker-end="url(#arrow)" />
      
      <g transform="translate(0, 90)">
        <rect width="200" height="80" rx="5" fill="#fff" stroke="#8e44ad" stroke-width="1" filter="url(#boxShadow)" />
        <text x="10" y="30" font-size="13" font-weight="bold">. Sales Reports</text>
        <text x="10" y="50" font-size="13" font-weight="bold">. Tax (GST) Reports</text>
        <text x="10" y="70" font-size="13" font-weight="bold">. Ledger Analytics</text>
      </g>
    </g>
  </g>

  <!-- Data Flow Summary Labels -->
  <text x="600" y="650" text-anchor="middle" font-size="14" fill="#666" font-style="italic">
    Seamlessly integrating Billing, Inventory Updates, and Financial Reporting in real-time.
  </text>
  
  <!-- Footer Design elements -->
  <line x1="50" y1="720" x2="1150" y2="720" stroke="#eee" stroke-width="1" />
  <text x="1150" y="745" text-anchor="end" font-size="12" fill="#999">SRI RAM FASHION ERP V1.0</text>

</svg>
